    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 2rem;
            background-color: #111;
            background-image: radial-gradient(rgba(255, 255, 255, .16) 1.2px, transparent 1.6px);
            background-size: 22px 22px;
            background-position: center;
            color: #eee;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        .logo { width: 180px; height: auto; display: block; margin: 0 auto; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .handle { margin: .35rem 0 0; color: #888; font-size: 1rem; }
        .bio { margin: 1rem auto 0; max-width: 42ch; color: #bbb; font-size: 1.05rem; line-height: 1.5; }
        nav { display: flex; gap: 1.25rem; }
        nav a {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            color: #aaa;
            border: 1px solid #2a2a2a;
            transition: color .2s, border-color .2s, transform .2s;
        }
        nav a:hover, nav a:focus-visible { color: #fff; border-color: #555; transform: translateY(-2px); outline: none; }
        nav svg { width: 22px; height: 22px; fill: currentColor; }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(ellipse at center, transparent 30%, #111 80%);
            pointer-events: none;
        }
        footer { position: fixed; bottom: 1rem; color: #555; font-size: .8rem; }

        /* Staggered fade-in */
        .fade { opacity: 0; animation: fade-in .8s ease-out forwards; }
        .logo.fade { animation-delay: .1s; }
        .handle.fade { animation-delay: .35s; }
        .bio.fade { animation-delay: .5s; }
        nav.fade { animation-delay: .7s; }
        footer.fade { animation-delay: .9s; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        @media (prefers-reduced-motion: reduce) {
            .fade { opacity: 1; animation: none; }
        }
    </style>
